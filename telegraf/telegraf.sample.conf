[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  name_override = "ml_predictions"
  servers = ["tcp://novalume-mqtt:1883"]
  topics = ["novalume/flutter/appliances"]
  qos = 0
  data_format = "json"
  tag_keys = ["id"]

[[outputs.influxdb_v2]]
  urls = ["http://novalume-influxdb3:8181"]
  token = "${INFLUX_TOKEN}"
  organization = "novalume"
  bucket = "predictions"
