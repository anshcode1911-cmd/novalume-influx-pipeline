[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  flush_interval = "1s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  name_override = "ml_predictions"
  servers = ["${MQTT_BROKER_URL}"]
  topics = ["novalume/flutter/appliances"]
  qos = 0
  data_format = "json"
  tag_keys = ["id"]

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "novalume"
  bucket = "predictions"
  namepass = ["ml_predictions"]
